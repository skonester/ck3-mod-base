name: Sync CK3 Mod Base

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: ck3-base-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge public upstream and sync base tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CK3 Sync Bot'
          git config user.email 'bot@ck3.local'
          git remote add upstream https://github.com/jesec/ck3-mod-base.git
          git fetch --no-tags upstream \
            '+refs/heads/master:refs/remotes/upstream/master' \
            '+refs/tags/base/*:refs/tags/base/*'

          branch=$(git branch --show-current)
          if [[ -z "$branch" ]]; then
            echo '::error::Checkout is not on a branch'
            exit 1
          fi

          if ! git merge-base --is-ancestor upstream/master HEAD; then
            # Keep this fork's credential-free workflow when upstream changes its own.
            workflow_copy=$(mktemp)
            cp .github/workflows/update-base.yml "$workflow_copy"

            merge_status=0
            git merge --no-commit --no-ff upstream/master || merge_status=$?
            cp "$workflow_copy" .github/workflows/update-base.yml
            git add .github/workflows/update-base.yml

            conflicts=$(git diff --name-only --diff-filter=U)
            if [[ -n "$conflicts" ]]; then
              echo "::error::Resolve upstream merge conflicts manually: $conflicts"
              exit 1
            fi
            if (( merge_status != 0 )) && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo '::error::Upstream merge failed'
              exit 1
            fi

            git commit -m 'Sync CK3 base from upstream'
            git push origin "HEAD:$branch"
          else
            echo 'Branch already contains the latest public upstream commit.'
          fi

          # Exact-version tags stay fixed; series tags follow upstream's latest.
          tag_refs=()
          while IFS= read -r ref; do
            tag=${ref#refs/tags/}
            if [[ "$tag" =~ ^base/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tag_refs+=("$ref")
            elif [[ "$tag" =~ ^base/[0-9]+(\.[0-9]+){0,2}$ ]]; then
              tag_refs+=("+$ref")
            fi
          done < <(git for-each-ref refs/tags/base --format='%(refname)')

          if (( ${#tag_refs[@]} > 0 )); then
            git -c push.followTags=false push origin "${tag_refs[@]}"
          fi
