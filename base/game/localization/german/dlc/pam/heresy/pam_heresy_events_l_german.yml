l_german:
 ##############################################
 # PAM heresy system - rite type localization #
 ##############################################
 cathar_rite: "Ritus nach katharischer Art"
 cathar_rite_name: "Ritus nach katharischer Art"
 cathar_rite_adj: "Katharisch"
 cathar_rite_adherent: "Katharisch"
 cathar_rite_adherent_plural: "Katharer"
 cathar_rite_desc: "Ein strenger dualistischer Ritus, der davon ausgeht, dass die stoffliche Welt von einem bösartigen Demiurgen geschaffen wurde. Die Perfecti unterziehen sich Keuschheits- und Armutsgelübden und lehnen die Sakramente der Kirche wie auch den Militärdienst im Namen Gottes ab."
 waldensian_rite: "Ritus nach waldensischer Art"
 waldensian_rite_name: "Ritus nach waldensischer Art"
 waldensian_rite_adj: "Waldensisch"
 waldensian_rite_adherent: "Waldenser"
 waldensian_rite_adherent_plural: "Waldenser"
 waldensian_rite_desc: "Ein Ritus barfüßiger Wanderprediger, die davon überzeugt sind, dass auch Laien die Heilige Schrift predigen dürfen, dass die offizielle Kirche kein Anrecht auf göttliche Gnade besitzt und dass Christen weder Besitz halten noch zu den Waffen greifen sollen."
 lollard_rite: "Ritus nach lollardischer Art"
 lollard_rite_name: "Ritus nach lollardischer Art"
 lollard_rite_adj: "Lollardisch"
 lollard_rite_adherent: "Lollarde"
 lollard_rite_adherent_plural: "Lollarden"
 lollard_rite_desc: "Ein volkssprachlicher Reformritus, der prunkvolle Rituale, die Transsubstantiationslehre, den Reliquienkult sowie einen vermögenden Klerus ablehnt. Die Bibel wird in der Gemeinsprache gelesen, und jeder Gläubige gilt selbst als Priester."
 hussite_rite: "Ritus nach hussitischer Art"
 hussite_rite_name: "Ritus nach hussitischer Art"
 hussite_rite_adj: "Hussitisch"
 hussite_rite_adherent: "Hussit"
 hussite_rite_adherent_plural: "Hussiten"
 hussite_rite_desc: "Ein böhmischer Reformritus, der fordert, dass auch Laien den Kelch empfangen dürfen, dass die Heilige Schrift in der Umgangssprache zugänglich ist und dass der klerikale Wohlstand und der Ablasshandel verboten werden. Seine Prediger bedienen sich reichlich der Argumente Wycliffs und sind überzeugt, dass Rom vom apostolischen Weg abgekommen ist."
 joachimite_rite: "Ritus nach joachimitischer Art"
 joachimite_rite_name: "Ritus nach joachimitischer Art"
 joachimite_rite_adj: "Joachimitisch"
 joachimite_rite_adherent: "Joachimit"
 joachimite_rite_adherent_plural: "Joachimiten"
 joachimite_rite_desc: "Ein apokalyptischer Ritus, der die Geschichte in drei Zeitalter unterteilt: Vater, Sohn und ein künftiges Zeitalter des Heiligen Geistes, in dem sich die Kirche auflösen und ein neuer komtemplativer Orden entstehen wird. Seine Anhänger werden in apostolischer Armut umherziehen, auf Marktplätzen predigen und mit leuchtenden Augen auf das bevorstehende Ende der Welt blicken."
 iconoclast_rite: "Ritus nach ikonoklastischer Art"
 iconoclast_rite_name: "Ritus nach ikonoklastischer Art"
 iconoclast_rite_adj: "Ikonoklastisch"
 iconoclast_rite_adherent: "Ikonoklast"
 iconoclast_rite_adherent_plural: "Ikonoklasten"
 iconoclast_rite_desc: "Eine Wiederbelebung der alten östlichen bilderfeindlichen Bewegung, die die Verehrung von Bildern als schleichenden Götzendienst verdammt und verlangt, dass Ikonen aus sowohl Kirchen als auch Privathäusern entfernt werden."
 bogomilist_rite: "Ritus nach bogomilischer Art"
 bogomilist_rite_name: "Ritus nach bogomilischer Art"
 bogomilist_rite_adj: "Bogomilisch"
 bogomilist_rite_adherent: "Bogomile"
 bogomilist_rite_adherent_plural: "Bogomilen"
 bogomilist_rite_desc: "Ein slawischer dualistischer Ritus, der sich auf den Priester Bogomil beruft. Seine Prediger wandern barfuß umher, lehnen Hierarchien ab, verweigern das Tragen von Waffen und lehren, dass Satan der Schöpfer der sichtbaren Welt sei."
 paulician_rite: "Ritus nach paulikianischer Art"
 paulician_rite_name: "Ritus nach paulikianischer Art"
 paulician_rite_adj: "Paulikianisch"
 paulician_rite_adherent: "Paulikianer"
 paulician_rite_adherent_plural: "Paulikianer"
 paulician_rite_desc: "Ein kämpferischer dualistischer Ritus, der in Kleinasien entstand. Er verachtet Ikonen und die etablierten religiösen Hierarchien, und seine Anhänger messen der unmittelbaren Lektüre der Paulusbriefe höchsten Wert bei und sind durchaus bereit, zur Verteidigung ihrer Glaubensreinheit zu den Waffen zu greifen."
 messalian_rite: "Ritus nach messalianischer Art"
 messalian_rite_name: "Ritus nach messalianischer Art"
 messalian_rite_adj: "Messalianisch"
 messalian_rite_adherent: "Messalianer"
 messalian_rite_adherent_plural: "Messalianer"
 messalian_rite_desc: "Ein esoterischer asketischer Ritus, der unablässige Gebete als einziges Sakrament von Wert erachtet. Denn sobald der Dämon, der in einem Gläubigen wohnt, ausgetrieben ist, kann kein fleischlicher Akt diesen Gläubigen jemals wieder besudeln."
 adoptionist_rite: "Ritus nach adoptionistischer Art"
 adoptionist_rite_name: "Ritus nach adoptionistischer Art"
 adoptionist_rite_adj: "Adoptionistisch"
 adoptionist_rite_adherent: "Adoptionist"
 adoptionist_rite_adherent_plural: "Adoptionisten"
 adoptionist_rite_desc: "Ein christologischer Ritus aus Iberien, der lehrt, dass Christus in seiner Menschlichkeit der angenommene und nicht der natürliche Sohn Gottes war – eine Lehre, die die karolingische Kirche als Krypto-Nestorianismus verurteilte."
 ###################################
 # Fervor reset descriptions       #
 ###################################
 pam_heresy_fervor_reset_component_1_desc: "Gläubige, die sich gegen die zunehmende [rite_divergence|E] erheben"
 pam_heresy_fervor_reset_component_2_desc: "Gläubige, die sich gegen einen neuen schismatischen [rite|E] erheben"
 pam_heresy_fervor_reset_component_3_desc: "Gläubige, die sich gegen ein ketzerisches Wiedererstarken erheben"
 ###################################
 # Component 1 - Light divergence  #
 ###################################
 heresy_light.0010.t: "Ketzerische Abweichung"
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName|U] "
 heresy_light.0010.desc.body.uneasy: "entfernte [new_rite.GetName] noch weiter vom [source_rite.GetAdjective|l]en Ritus, "
 heresy_light.0010.desc.body.alarming: "entfernte [new_rite.GetName] gefährlich weit von der akzeptierten [source_rite.GetAdjective|l]en Praktik, "
 heresy_light.0010.desc.body.dangerous: "ließ den [new_rite.GetName] zu etwas [source_rite.GetAdjective|U]em abweichen, was kaum noch als verwandt angesehen werden kann, "
 heresy_light.0010.desc.differing.tenet: "wobei die auffälligste neue Ausrichtung klar ist: [differing_tenet.GetBaseName]."
 heresy_light.0010.desc.differing.doctrine: "wobei die auffälligste neue Ausrichtung klar ist: [differing_doctrine.GetDescriptiveName(source_rite.GetFaith.Self)]."
 heresy_light.0010.desc.differing.fallback: "wobei die neuen Bezeichnungen zu subtil sind, um sie mit einem einzigen Namen zu benennen."
 ###################################################
 # Component 2 - New dangerously divergent rite    #
 ###################################################
 heresy_dangerous_rite.0010.t: "Ein ketzerischer Ritus"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "Der [founder.GetCulture.GetName|l]e Erzbischof [founder.GetFirstName] "
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName|U] "
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "vom [founder_clerical_title.GetNameNoTier] "
 heresy_dangerous_rite.0010.desc.opener.lands: "von [founder.GetPrimaryTitle.GetBaseNameNoTier]"
 heresy_dangerous_rite.0010.desc.body.alarming: "distanzierte sich deutlich vom [source_rite.GetAdjective|l]en Ritus und rief den [new_rite.GetName] aus – "
 heresy_dangerous_rite.0010.desc.body.severe: "löste sich bis auf den Namen vom [source_rite.GetAdjective|l]en Ritus und rief den [new_rite.GetName] aus – "
 heresy_dangerous_rite.0010.desc.differing.tenet: "wobei als kühnster unter den neuen Erlassen ein ganz bestimmter Grundsatz ([differing_tenet.GetBaseName]) offen gepredigt wird."
 heresy_dangerous_rite.0010.desc.differing.doctrine: "wobei als kühnster unter den neuen Erlassen eine ganz bestimmte Doktrin ([differing_doctrine.GetDescriptiveName(source_rite.GetFaith.Self)]) offen gepredigt wird."
 heresy_dangerous_rite.0010.desc.differing.fallback: "wobei die neuen Erlasse zu zahlreich waren, um sie in einer einzigen Ausrichtung zusammenzufassen."
 heresy_dangerous_rite.0010.desc.outro: "\n\nDie Prediger strömen in alle Ecken des Reichs aus – eine heilige Schrift ([origin_faith.ReligiousText]) in der einen Hand, eine Fackel in der anderen. Die Ältesten des Glaubens ([origin_faith.GetName]) werden kein gutes Wort darüber verlieren.\n\nEine mögliche Ketzerei wurde schriftlich festgehalten und wird von der Kanzel aus lautstark verkündet: Schwert und Feuer werden Antworten geben, wo Predigten es nicht vermögen."
 heresy_dangerous_rite.0010.a: "Lasst es beginnen."
 heresy_dangerous_rite.0010.c: "Klingt für mich nach Ketzerei …"
 heresy_dangerous_rite.spread.title: "Der neue Ritus breitet sich aus"
 ###################################################
 # Component 3 - Historical heresy outbreak        #
 ###################################################
 # First-fire titles for the named historical heresies use the iconic founder.
 # Resurgences and the always-anonymous heresies fall back on a generic title.
 heresy_historical.0050.t.lollard.first: "Ketzerei nach Wyclif"
 heresy_historical.0050.t.hussite.first: "Ketzerei nach Hus"
 heresy_historical.0050.t.joachimite.first: "Ketzerei nach Joachim"
 heresy_historical.0050.t.cathar.first: "Ketzerei der Katharer"
 heresy_historical.0050.t.waldensian.first: "Ketzerei nach Waldo"
 heresy_historical.0050.t.bogomilist.first: "Ketzerei nach Bogomil"
 heresy_historical.0050.t.resurgence: "Die Rückkehr der [heresy_faith.GetAdjectiveNoTooltip|l]en Ketzerei"
 heresy_historical.0050.t.fallback: "Eine [heresy_faith.GetAdjectiveNoTooltip|l]e Ketzerei"
 heresy_historical.0050.desc.nearby.first: "Es ist unmöglich geworden, [founder.GetTitledFirstName] zu übersehen, denn [founder.Custom('DE_PRO_PER_S_3P_N')] predigt die [heresy_faith.GetAdjective|l]e Sache in [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Unsere [origin_faith.PriestMalePlural] verdammten [founder.Custom('DE_PRO_POS_S_3P')]e Lehren von ihren Kanzeln aus, was diese Inhalte nur umso anziehender für das gemeine Kirchenvolk machte, wie es scheint.\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "Die [heresy_faith.GetAdjective|l]e Sache ist in [epicenter_ruler.GetCapitalLocation.GetTitle.GetName] neu entfacht, nicht fern von jenem Ort, wo sie einst hell loderte. Während [founder.GetTitledFirstName] spricht, erinnern sich Höflinge und das gemeine Volk noch immer an die ruchlose Verführung der Ketzerei.\n\n"
 heresy_historical.0050.desc.distant.first: "Pilger und Händler bringen uns Kunde von der [heresy_faith.GetAdjective|l]en Sache, die die Geister im fernen [epicenter_ruler.GetCapitalLocation.GetTitle.GetName] entfacht hat. Die Predigten von [founder.GetTitledFirstName] nähern sich langsam unseren Toren.\n\n"
 heresy_historical.0050.desc.distant.resurgence: "Uns erreicht die Kunde, dass die [heresy_faith.GetAdjective|l]e Sache im fernen [epicenter_ruler.GetCapitalLocation.GetTitle.GetName] wieder auflebt. Es scheint, dass [founder.GetTitledFirstName] weder das Feuer der Verdammnis fürchtet noch die Zensur und Erlasse gegen [founder.Custom('DE_PRO_POS_S_3P')]e Art der Blasphemie.\n\n"
 heresy_historical.0050.desc.insider.first: "In [epicenter_ruler.GetCapitalLocation.GetTitle.GetName] erklärt sich [founder.GetTitledFirstName] kühn für die [heresy_faith.GetAdjective|l]e Sache. Das Wispern vergangener Jahre wurde endlich zu einer Predigt, die die ganze Welt hören soll.\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.GetTitledFirstName|U] entfacht erneut die [heresy_faith.GetAdjective|l]e Sache in [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Die Welt erwacht einmal mehr ob unseres heiligen Lichts, und die göttliche Wahrheit wird von Neuem verkündet!\n\n"
 heresy_historical.0050.gloss.lollard: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt die Schrift in der Volkssprache, verweigert der Priesterschaft den Besitz von Ländereien und verwehrt sich gegen Schauspiel am Altar."
 heresy_historical.0050.gloss.hussite: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt die Kommunion unter beiderlei Gestalt für die Laien, die Schrift in Böhmisch und eine Kirche, die von ihren erworbenen Würden ablassen soll."
 heresy_historical.0050.gloss.joachimite: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt das bevorstehende Zeitalter des Heiligen Geistes, in dem die priesterlichen Anweisungen Roms durch eine kontemplative Kirche der armen Menschen ersetzt werden."
 heresy_historical.0050.gloss.cathar: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt einen starken Dualismus und nennt die Welt das Werk einer bösartigen Gottheit und die Römische Kirche die Hure Babylon."
 heresy_historical.0050.gloss.waldensian: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt von einer armen Kirche mit barfüßigen Laienpredigern: Eiden und der Kriegsführung wird abgeschworen, und die Schrift gehört allen."
 heresy_historical.0050.gloss.bogomilist: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt einen slawischen Dualismus: Die Welt gehört Satan, und nur unablässige Gebete können die Seele zurückgewinnen."
 heresy_historical.0050.gloss.paulician: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt das alte östliche Feuer: Dualismus, Bilderstürmerei und eine strenge Auslegung des Paulus. [founder.Custom('DE_PRO_POS_S_3P')|U]e Anhänger ziehen das Schwert dem Scheiterhaufen vor."
 heresy_historical.0050.gloss.iconoclast: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt die Wiedergeburt der Bilderstürmerei: Gemälde von Christus und vergoldete Heilige sind Götzenbilder, und das Zweite Konzil von Nicäa war ein Fehler, der nie gesühnt wurde."
 heresy_historical.0050.gloss.adoptionist: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] belebte das iberische Argument neu: In [founder.Custom('DE_PRO_POS_S_3P')]er Menschlichkeit war Christus angenommen."
 heresy_historical.0050.gloss.messalian: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt ohne Unterlass anstelle der Sakramente von einem inneren Dämon, den kein Priester auszutreiben vermag."
 heresy_historical.0050.gloss.generic: "[founder.Custom('DE_PRO_PER_S_3P_N')|U] predigt eine Doktrin der radikalen Erneuerung, die der [heresy_faith.GetAdjective|l]en Tradition entstammt."
 heresy_historical.0050.history.lollard: "\n\nEs nahm seinen Anfang in Oxford, wo die Meister und die Studenten das kanonische Recht zu hinterfragen begannen. Nun verbreiten sich ihre übersetzten Schriften mit einer Geschwindigkeit, die kein Priester zu bremsen vermag, von den Klöstern in die Städte."
 heresy_historical.0050.history.hussite: "\n\nDiese Bewegung begann in der Bethlehemkapelle in Prag, wo die Predigt erstmals in der böhmischen Sprache erfolgte und der heilige Kelch erstmals den Laien angeboten wurde."
 heresy_historical.0050.history.joachimite: "\n\nAlles begann in einem kalabrischen Kloster, in dem ein Abt die Offenbarung wie einen Kalender las und die Jahre bis zum nächsten heraufziehenden Zeitalter zählte. Hochrangige Bettelgeschwister nahmen die Zählung auf, und nun ist sie auf den Märkten im gesamten Land in aller Munde."
 heresy_historical.0050.history.cathar: "\n\nDiese Überzeugungen wanderten vom Balkan aus westwärts, und im Languedoc werden sie nun von Webern und Vicomtes gleichermaßen verkündet. Ihre spirituellen Anführer, die Perfecti, ziehen zu zweit und barfüßig umher und kümmern sich um die Kranken und Sterbenden."
 heresy_historical.0050.history.waldensian: "\n\nEs begann mit einem Kaufmann aus Lyon, der seinen Reichtum an die Armen gab und fortan in den Straßen predigte. Nun wandern jene, die er inspirierte, barfüßig über hohe Berge und teilen das Wort Gottes mit den geringsten Menschen."
 heresy_historical.0050.history.bogomilist: "\n\nDiese Bewegung entstand erstmalig, als Dorfpriester predigten, Brot und Wein seien einfach nur das: Brot und Wein. Slawische Dorfbewohner hingen dieser Offenbarung an, und kein Kirchenbann eines Patriarchen brachte sie bisher davon ab."
 heresy_historical.0050.history.paulician: "\n\nSie gründet auf einer strengen Auslegung des Paulus, und so ist diese Bewegung älter als jede Kathedrale am Bosporus. In Tephrike in den armenischen Hochlanden gedeihten die Paulikianer einst, ehe das byzantinische Kaiserreich ihren Staat auslöschte."
 heresy_historical.0050.history.iconoclast: "\n\nZweimal reinigte das Kaiserreich seine Kirchen von ihren gemalten Christusbildern und ihren vergoldeten Heiligen, und zweimal kehrten diese Ikonen zurück. Nun wurde die Frage der Götzenverehrung erneut aufgeworfen."
 heresy_historical.0050.history.adoptionist: "\n\nIn den iberischen Grenzlanden lehren gewisse Bischöfe, dass der Sohn des Zimmermannns in seine Herrlichkeit angenommen und nicht in sie hineingeboren wurde. Frankfurt und Aachen verdammten dies, und dennoch fragen die Einheimischen weiterhin, wo die Wahrheit wirklich liegt."
 heresy_historical.0050.history.messalian: "\n\nAlles erwuchs in den Wüsten Mesopotamiens: Wandermönche, die ohne Schlaf predigten und behaupteten, jeder Seele wohne ein Dämon inne, den kein Priester austreiben könne. Ephesos verdammte sie; sie zogen dennoch weiter."
 heresy_historical.0050.history.generic: "\n\nJedes Zeitalter hat sein eigenes Feuer: Klöster, die ihre Regeln brachen, Prediger, die aus der Kathedrale traten und nie wieder zurückkehrten. Dieser hier ist nun auf dem Weg."
 heresy_historical.0050.a: "Ihre Sache ist gerecht. Ich werde sie annehmen."
 heresy_historical.0050.b: "Solch eine Überzeugung … Ich wünschte, ich wäre es."
 heresy_historical.0050.c: "Ketzer …"
 heresy_historical.0050.c.insider: "Wir halten durch. Die Sache breitet sich aus."
 heresy_historical.spread.title: "Die Ketzerei breitet sich aus"
