 CARDINALS_VIEW_COLLEGE_DESCRIPTION: "À la mort du pape, le [cardinal|el] le plus populaire, le plus pieux ou le plus puissant ayant le plus grand nombre de partisans accédera au pontificat."
 theocratic_elective_pious: "Le Pieux"
 theocratic_elective_pious_desc: "#flavor Le Collège doit présenter un candidat dont personne ne puisse dire qu’il est indigne, un cardinal dont la vie est celle d’un saint.#!\n\nPour devenir #EMP $theocratic_elective_pious|l$#!, vous devez vous démarquer de tous les autres [cardinals|El] par votre sainteté. C’est le [piety_level|El] qui pèse le plus dans la balance, suivi de l’[learning|El] et de l’avancement en tant qu’[GetTrait('lifestyle_scholar').GetName( GetPlayer )|l], [GetTrait('pilgrim').GetName( GetPlayer )|l] ou [GetTrait('lifestyle_mystic').GetName( GetPlayer )|l]. Un seul [sin|El] vous fait perdre plus de points qu’une [virtue|El] ne vous en fait gagner.[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "Le Populiste"
 theocratic_elective_populist_desc: "#flavor Un pape que les fidèles ne suivent pas n’est pas un pape du tout ; c’est pourquoi le Collège propose quelqu’un que l’on acclame déjà dans les rues.#!\n\nPour devenir #EMP $theocratic_elective_populist|l$#!, démarquez-vous de tous les autres [cardinals|El] en termes de renommée. Augmentez votre [prestige_level|El] et de [diplomacy|El], faites-vous des [friends|El] au sein du [college_of_cardinals|E], ayez des [personal_tenets|El] bénéficiant d’une grande [Concept('tenet_popularity', 'popularité')|E] et utilisez la [decision|El] [GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName].[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "Le Puissant"
 theocratic_elective_powerful_desc: "#flavor Le trône de Saint-Pierre compte autant d’ennemis que de fidèles ; c’est pourquoi le Collège propose un prélat disposant des moyens nécessaires pour le soutenir.#!\n\nPour devenir #EMP $theocratic_elective_powerful|l$#!, vous devez vous démarquer de tous les autres [cardinals|El] en termes d’influence dans ce monde. Veillez à ce que votre [rite|El] s’étende à davantage de [counties|El], préservez les [holy_sites|El], augmentez votre [dynasty_prestige_level|El] ou utilisez l’[character_interaction|El] #V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#! pour acheter votre ascension.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
