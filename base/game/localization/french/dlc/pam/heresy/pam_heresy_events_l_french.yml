l_french:
 ##############################################
 # PAM heresy system - rite type localization #
 ##############################################
 cathar_rite: "$cathar$"
 cathar_rite_name: "Cathare"
 cathar_rite_adj: "cathare"
 cathar_rite_adherent: "cathare"
 cathar_rite_adherent_plural: "cathares"
 cathar_rite_desc: "Rite dualiste austère qui considère le monde matériel comme l’œuvre d’un démiurge maléfique. Ses perfecti font vœu de pauvreté et de chasteté, rejettent les sacrements de l’Église officielle et refusent le service militaire au nom de Dieu."
 waldensian_rite: "$waldensian$"
 waldensian_rite_name: "Vaudois"
 waldensian_rite_adj: "vaudoise"
 waldensian_rite_adherent: "vaudois"
 waldensian_rite_adherent_plural: "vaudois"
 waldensian_rite_desc: "Rite pratiqué par des prédicateurs mendiants aux pieds nus qui affirment que les laïcs peuvent prêcher les Écritures, que l’Église n’a pas l’exclusivité de la grâce, et que les chrétiens ne doivent ni posséder de biens ni prendre les armes."
 lollard_rite: "$lollard$"
 lollard_rite_name: "Lollard"
 lollard_rite_adj: "lollarde"
 lollard_rite_adherent: "lollard"
 lollard_rite_adherent_plural: "lollards"
 lollard_rite_desc: "Rite de réforme populaire qui rejette les rituels fastueux, la transsubstantiation, le culte des reliques et un clergé fortuné. La Bible y est lue dans la langue vernaculaire et chaque croyant est considéré comme un prêtre à part entière."
 hussite_rite: "$hussite$"
 hussite_rite_name: "Hussite"
 hussite_rite_adj: "hussite"
 hussite_rite_adherent: "hussite"
 hussite_rite_adherent_plural: "hussites"
 hussite_rite_desc: "Courant réformateur bohémien qui revendique l’accès des laïcs au calice, la lecture des Écritures en langue vernaculaire, ainsi que la fin de la richesse du clergé et de la vente d’indulgences. Ses prédicateurs s’inspirent largement des arguments wycliffites et sont animés par la conviction inébranlable que Rome s’est écartée de la voie apostolique."
 joachimite_rite: "$joachimite$"
 joachimite_rite_name: "Joachimite"
 joachimite_rite_adj: "joachimite"
 joachimite_rite_adherent: "joachimite"
 joachimite_rite_adherent_plural: "joachimites"
 joachimite_rite_desc: "Rite apocalyptique qui divise l’histoire en trois ères : le Père, le Fils et une ère à venir du Saint-Esprit, qui mettra fin à l’Église institutionnelle et fera naître un nouvel ordre contemplatif. Ses adeptes mènent une vie de pauvreté apostolique, prêchent sur les places publiques et contemplent, les yeux brillants, la fin imminente du monde."
 iconoclast_rite: "$iconoclast$"
 iconoclast_rite_name: "Iconoclaste"
 iconoclast_rite_adj: "iconoclaste"
 iconoclast_rite_adherent: "iconoclaste"
 iconoclast_rite_adherent_plural: "iconoclastes"
 iconoclast_rite_desc: "Une renaissance de l’ancien mouvement iconoclaste oriental, qui condamne le culte des images comme une forme insidieuse d’idolâtrie et exige que les icônes soient bannies tant des églises que des maisons privées."
 bogomilist_rite: "$bogomilist$"
 bogomilist_rite_name: "Bogomile"
 bogomilist_rite_adj: "bogomile"
 bogomilist_rite_adherent: "bogomile"
 bogomilist_rite_adherent_plural: "bogomiles"
 bogomilist_rite_desc: "Rite dualiste slave qui se réclame du prêtre Bogomil. Ses prédicateurs errent pieds nus, rejettent les hiérarchies, refusent de porter des armes et enseignent que Satan est le créateur du monde visible."
 paulician_rite: "$paulician$"
 paulician_rite_name: "Paulicien"
 paulician_rite_adj: "paulicienne"
 paulician_rite_adherent: "paulicien"
 paulician_rite_adherent_plural: "pauliciens"
 paulician_rite_desc: "Rite dualiste et martial, né en Asie Mineure. Il méprise les icônes et les hiérarchies religieuses officielles, et ses pratiquants accordent une grande importance à la lecture directe des épîtres de Paul et sont disposés à prendre les armes pour défendre leur pureté."
 messalian_rite: "$messalian$"
 messalian_rite_name: "Messalien"
 messalian_rite_adj: "messalienne"
 messalian_rite_adherent: "messalien"
 messalian_rite_adherent_plural: "messaliens"
 messalian_rite_desc: "Rite ésotérique et ascétique qui considère la prière continue comme le seul sacrement véritable, et qui enseigne que, dès lors qu’un croyant a chassé le démon qui habite en lui, aucun acte charnel ne pourra plus jamais le souiller."
 adoptionist_rite: "$adoptionist$"
 adoptionist_rite_name: "Adoptien"
 adoptionist_rite_adj: "adoptienne"
 adoptionist_rite_adherent: "adoptien"
 adoptionist_rite_adherent_plural: "adoptiens"
 adoptionist_rite_desc: "Rite christologique ibérique qui considère le Christ, en tant qu’être humain, comme le Fils adoptif et non naturel de Dieu — une doctrine que l’Église carolingienne considérait comme une forme insidieuse de nestorianisme."
 ###################################
 # Fervor reset descriptions       #
 ###################################
 pam_heresy_fervor_reset_component_1_desc: "Croyants qui s’élèvent contre cette [rite_divergence|El] croissante"
 pam_heresy_fervor_reset_component_2_desc: "Croyants qui s’opposent à un nouveau [rite|El] schismatique"
 pam_heresy_fervor_reset_component_3_desc: "Croyants qui s’opposent à la résurgence de l’hérésie"
 ###################################
 # Component 1 - Light divergence  #
 ###################################
 heresy_light.0010.t: "Dérive hérétique"
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.Custom('FR_le_Char_Pi')|U][founder.GetTitledFirstName] "
 heresy_light.0010.desc.body.uneasy: "a éloigné davantage le rite [new_rite.GetAdherentName] du [source_rite.GetAdherentName], "
 heresy_light.0010.desc.body.alarming: "a éloigné dangereusement le rite [new_rite.GetAdherentName] de la pratique [source_rite.GetAdjective] acceptée, "
 heresy_light.0010.desc.body.dangerous: "a fait dévier le rite [new_rite.GetAdherentName] vers une pratique [source_rite.GetAdjective] qui ne peut même plus être considérée comme apparentée, "
 heresy_light.0010.desc.differing.tenet: "avec cette nouvelle orientation qui attire l’attention : [differing_tenet.GetBaseName|l]."
 heresy_light.0010.desc.differing.doctrine: "avec cette nouvelle orientation qui attire l’attention : [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )|l]."
 heresy_light.0010.desc.differing.fallback: "et les nouvelles appellations sont trop subtiles pour être résumées en un seul nom."
 ###################################################
 # Component 2 - New dangerously divergent rite    #
 ###################################################
 heresy_dangerous_rite.0010.t: "Un rite hérétique"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "L’archevêque [founder.GetFirstName] d’origine [founder.GetCulture.GetName] "
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.Custom('FR_le_Char_Pi')|U][founder.GetTitledFirstName] "
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "de [founder_clerical_title.GetNameNoTier] "
 heresy_dangerous_rite.0010.desc.opener.lands: "de [founder.GetPrimaryTitle.GetBaseNameNoTier] "
 heresy_dangerous_rite.0010.desc.body.alarming: "s’est clairement démarqué[founder.Custom('FR_E')] du rite [source_rite.GetAdherentName] et a proclamé le rite [new_rite.GetAdherentName] – "
 heresy_dangerous_rite.0010.desc.body.severe: "s’est détaché[founder.Custom('FR_E')] du rite [source_rite.GetAdherentName], à l’exception de son nom, et a proclamé le rite [new_rite.GetAdherentName] – "
 heresy_dangerous_rite.0010.desc.differing.tenet: "parmi les nouveaux décrets, le plus audacieux prône ouvertement [differing_tenet.GetBaseName]."
 heresy_dangerous_rite.0010.desc.differing.doctrine: "parmi les nouveaux décrets, le plus audacieux prône ouvertement [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]."
 heresy_dangerous_rite.0010.desc.differing.fallback: "Les nouveaux décrets sont trop nombreux pour qu’on puisse établir une ligne directrice unique."
 heresy_dangerous_rite.0010.desc.outro: "\n\nLes prédicateurs se répandent aux quatre coins du pays – [origin_faith.ReligiousText] dans une main, une torche dans l’autre. Les anciens de la foi [origin_faith.GetAdjective] n’en diront pas du bien.\n\nUne hérésie potentielle a été consignée par écrit et est proclamée haut et fort depuis la chaire : le fer et le feu apporteront des réponses là où les sermons en sont incapables."
 heresy_dangerous_rite.0010.a: "Que le spectacle commence."
 heresy_dangerous_rite.0010.c: "Pour moi, ça ressemble à de l’hérésie..."
 heresy_dangerous_rite.spread.title: "Le nouveau rite se propage"
 ###################################################
 # Component 3 - Historical heresy outbreak        #
 ###################################################
 # First-fire titles for the named historical heresies use the iconic founder.
 # Resurgences and the always-anonymous heresies fall back on a generic title.
 heresy_historical.0050.t.lollard.first: "L’hérésie de Wyclif"
 heresy_historical.0050.t.hussite.first: "L’hérésie de Huss"
 heresy_historical.0050.t.joachimite.first: "L’hérésie de Joachim"
 heresy_historical.0050.t.cathar.first: "L’hérésie cathare"
 heresy_historical.0050.t.waldensian.first: "L’hérésie de Valdès"
 heresy_historical.0050.t.bogomilist.first: "L’hérésie de Bogomil"
 heresy_historical.0050.t.resurgence: "Le retour de l’hérésie [heresy_faith.GetAdjectiveNoTooltip]"
 heresy_historical.0050.t.fallback: "Une hérésie [heresy_faith.GetAdjectiveNoTooltip]"
 heresy_historical.0050.desc.nearby.first: "Il est désormais impossible d’ignorer [founder.Custom('FR_le_Char_Pi')][founder.GetTitledFirstName] qui prêche la cause [heresy_faith.GetAdjective] à [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Nos [origin_faith.PriestMalePlural] dénoncent ses enseignements depuis la chaire, mais cela semble les rendre plus attrayants aux yeux des fidèles ordinaires.\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "La cause manichéenne a été ravivée en [epicenter_ruler.GetCapitalLocation.GetTitle.GetName], non loin de son ancien foyer. Tandis que [founder.Custom('FR_le_Char_Pi')][founder.GetTitledFirstName] s’exprime, courtisans comme gens du peuple ont encore en mémoire l’attrait dangereux de l’hérésie.\n\n"
 heresy_historical.0050.desc.distant.first: "Pèlerins et marchands nous informent sur la cause [heresy_faith.GetAdjective] qui a enflammé les esprits dans les lointaines terres de [epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTier]. Les prêches [founder.Custom('FR_du_Char_Pi')][founder.GetTitledFirstName] se rapprochent peu à peu de nos portes.\n\n"
 heresy_historical.0050.desc.distant.resurgence: "Nous avons appris que la cause [heresy_faith.GetAdjective] refait surface dans les lointaines terres de [epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTier]. Il semble que [founder.Custom('FR_le_Char_Pi')][founder.GetTitledFirstName] ne craigne ni le feu de la damnation, ni la censure, ni les décrets pris à l’encontre de son blasphème.\n\n"
 heresy_historical.0050.desc.insider.first: "En [epicenter_ruler.GetCapitalLocation.GetTitle.GetName], [founder.Custom('FR_le_Char_Pi')][founder.GetTitledFirstName] professe avec audace la cause [heresy_faith.GetAdjective]. Les murmures de ces dernières années sont enfin devenus un sermon que le monde entier doit entendre.\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.Custom('FR_le_Char_Pi')|U][founder.GetTitledFirstName] ravive la cause [heresy_faith.GetAdjective] en [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Le monde s’éveille une fois de plus à notre lumière sacrée et la vérité divine est à nouveau proclamée !\n\n"
 heresy_historical.0050.gloss.lollard: "[founder.Custom('FR_IlElle')|U] prêche les Écritures dans la langue du peuple, interdit aux prêtres de posséder des terres et s’oppose aux représentations théâtrales à l’autel."
 heresy_historical.0050.gloss.hussite: "[founder.Custom('FR_IlElle')|U] prône la communion sous les deux espèces pour les laïcs, les Écritures en bohémien et une Église qui devrait renoncer à ses dignités achetées."
 heresy_historical.0050.gloss.joachimite: "[founder.Custom('FR_IlElle')|U] prêche l’avènement imminent de l’ère du Saint-Esprit, au cours de laquelle les directives sacerdotales de Rome seront remplacées par une Église contemplative au service des pauvres."
 heresy_historical.0050.gloss.cathar: "[founder.Custom('FR_IlElle')|U] prône un dualisme marqué et qualifie le monde d’« œuvre d’une divinité maléfique » et l’Église romaine de « prostituée de Babylone »."
 heresy_historical.0050.gloss.waldensian: "[founder.Custom('FR_IlElle')|U] prône une Église pauvre, composée de prédicateurs laïcs aux pieds nus : renoncer aux serments et aux guerres, et faire en sorte que les Écritures appartiennent à tous."
 heresy_historical.0050.gloss.bogomilist: "[founder.Custom('FR_IlElle')|U] prône un dualisme slave : le monde appartient à Satan, et seules des prières incessantes peuvent permettre de reconquérir l’âme."
 heresy_historical.0050.gloss.paulician: "[founder.Custom('FR_IlElle')|U] prêche l’ancienne foi orientale : le dualisme, l’iconoclasme et une interprétation stricte de Paul. Ses disciples préfèrent l’épée au bûcher."
 heresy_historical.0050.gloss.iconoclast: "[founder.Custom('FR_IlElle')|U] prône la renaissance de l’iconoclasme : les tableaux représentant le Christ et les saints dorés sont des idoles, et le deuxième concile de Nicée fut une erreur qui n’a jamais été expiée."
 heresy_historical.0050.gloss.adoptionist: "[founder.Custom('FR_IlElle')|U] reprend l’ancien argument ibérique : dans son humanité, le Christ a été adopté."
 heresy_historical.0050.gloss.messalian: "[founder.Custom('FR_IlElle')|U] prône une prière ininterrompue plutôt que les sacrements, et évoque un démon intérieur qu’aucun prêtre n’a le pouvoir d’exorciser."
 heresy_historical.0050.gloss.generic: "[founder.Custom('FR_IlElle')|U] prêche une doctrine de renouveau radical qui s’inspire de la tradition [heresy_faith.GetAdjective]."
 heresy_historical.0050.history.lollard: "\n\nTout a commencé à Oxford, où maîtres et élèves remettaient en question le droit canonique. Leurs Écritures traduites passent désormais du cloître au peuple, trop rapidement pour être endigué."
 heresy_historical.0050.history.hussite: "\n\nCe mouvement a vu le jour à la chapelle de Bethléem à Prague : pour la première fois, les sermons sont prononcés en langue bohémienne et le saint calice est remis aux laïcs."
 heresy_historical.0050.history.joachimite: "\n\nTout a commencé dans un monastère calabrais, où un abbé a lu l’Apocalypse comme un calendrier et a compté les années jusqu’à l’avènement d’une nouvelle ère. Des mendiants itinérants ont poursuivi ce décompte, et aujourd’hui, on en parle sur toutes les places de marché."
 heresy_historical.0050.history.cathar: "\n\nCes croyances se sont propagées vers l’ouest depuis les Balkans et, aujourd’hui, dans le Languedoc, tisserands comme vicomtes y adhèrent. Leurs chefs spirituels, les perfecti, marchent pieds nus par deux et viennent en aide aux malades et aux mourants."
 heresy_historical.0050.history.waldensian: "\n\nTout a commencé avec un marchand lyonnais qui a donné toute sa fortune aux pauvres et s’est mis à prêcher dans les rues. Aujourd’hui, ceux qu’il a inspirés parcourent pieds nus les hautes montagnes et partagent la parole de Dieu avec les plus humbles des hommes."
 heresy_historical.0050.history.bogomilist: "\n\nCe mouvement a vu le jour lorsque des prêtres de village ont enseigné que le pain et le vin n’étaient rien d’autre que du pain et du vin. Les paysans slaves se sont accrochés à cette révélation et aucun anathème du patriarche n’a pu les en dissuader."
 heresy_historical.0050.history.paulician: "\n\nFondé sur une interprétation stricte de saint Paul, ce mouvement est plus ancien que n’importe quelle cathédrale du Bosphore. À Téphrikè, dans les hautes terres d’Arménie, les pauliciens ont prospéré avant que l’Empire byzantin n’anéantisse leur État."
 heresy_historical.0050.history.iconoclast: "\n\nÀ deux reprises, l’Empire a vidé ses églises de leurs représentations peintes du Christ et de leurs saints dorés, et, à deux reprises, les icônes sont revenues. Aujourd’hui, la question de l’idolâtrie refait surface."
 heresy_historical.0050.history.adoptionist: "\n\nDans les régions frontalières de la péninsule ibérique, un groupe d’évêques enseignent que le Fils du charpentier avait été adopté et non né dans la grâce. Francfort et Aix-la-Chapelle ont condamné cette doctrine, mais les habitants continuent néanmoins de se demander où se trouve réellement la vérité."
 heresy_historical.0050.history.messalian: "\n\nCela a commencé dans les déserts de Mésopotamie : des moines errants qui prêchaient sans dormir et affirmaient que chaque âme abritait un démon qu’aucun prêtre ne pouvait exorciser. Éphèse les a condamnés, mais ils ont poursuivi leur chemin."
 heresy_historical.0050.history.generic: "\n\nChaque époque engendre ses propres bouleversements : des cloîtres qui enfreignent leurs règles, des prédicateurs qui quittent la cathédrale pour ne plus y revenir. Celui-ci est justement en cours."
 heresy_historical.0050.a: "Leur cause est juste. Je vais la défendre."
 heresy_historical.0050.b: "Quelle conviction… Si seulement cela avait été moi."
 heresy_historical.0050.c: "Maudits hérétiques..."
 heresy_historical.0050.c.insider: "On tient bon. La cause prend de l’ampleur."
 heresy_historical.spread.title: "L’hérésie se propage"
