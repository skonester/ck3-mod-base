l_simp_chinese:
 ##############################################
 # PAM heresy system - rite type localization #
 ##############################################
 cathar_rite: "$cathar$"
 cathar_rite_name: "清洁派"
 cathar_rite_adj: "清洁派"
 cathar_rite_adherent: "清洁派信徒"
 cathar_rite_adherent_plural: "清洁派信徒"
 cathar_rite_desc: "一种苦修二元论礼仪，主张物质世界由邪恶的巨匠造物主所造。其“完人”发愿守贫守贞，拒斥建制教会的圣事，并以神的名义拒绝服兵役。"
 waldensian_rite: "$waldensian$"
 waldensian_rite_name: "瓦勒度派"
 waldensian_rite_adj: "瓦勒度派"
 waldensian_rite_adherent: "瓦勒度派信徒"
 waldensian_rite_adherent_plural: "瓦勒度派信徒"
 waldensian_rite_desc: "由赤脚托钵传教士组成的礼仪，坚持平信徒有权宣讲圣经，认为建制教会对恩典无独占权，主张基督徒不应拥有私产亦不得拿起武器。"
 lollard_rite: "$lollard$"
 lollard_rite_name: "罗拉德派"
 lollard_rite_adj: "罗拉德派"
 lollard_rite_adherent: "罗拉德派信徒"
 lollard_rite_adherent_plural: "罗拉德派信徒"
 lollard_rite_desc: "一种方言改革礼仪，反对繁文缛节的宗教仪式、变体论、圣物崇拜与神职人员聚敛财富。该派主张以通俗语言诵读圣经，认为每位信徒本身即是祭司。"
 hussite_rite: "$hussite$"
 hussite_rite_name: "胡斯派"
 hussite_rite_adj: "胡斯派"
 hussite_rite_adherent: "胡斯派信徒"
 hussite_rite_adherent_plural: "胡斯派信徒"
 hussite_rite_desc: "源自波希米亚的改革礼仪，核心诉求包括平信徒领受圣爵、圣经方言化、废除神职财富与大赦买卖。其传教士大量援引威克里夫派论点，坚信罗马教会已背离使徒正道。"
 joachimite_rite: "$joachimite$"
 joachimite_rite_name: "约阿基姆派"
 joachimite_rite_adj: "约阿基姆派"
 joachimite_rite_adherent: "约阿基姆派信徒"
 joachimite_rite_adherent_plural: "约阿基姆派信徒"
 joachimite_rite_desc: "一种末世论礼仪，将历史划分为三个时代：圣父时代、圣子时代，以及即将到来的圣神时代——届时建制教会将解体，新的默观修会将兴起。其信徒以使徒式的清贫游走四方，在市集宣讲教义，热切期盼世界末日的临近。"
 iconoclast_rite: "$iconoclast$"
 iconoclast_rite_name: "圣像破坏派"
 iconoclast_rite_adj: "圣像破坏派"
 iconoclast_rite_adherent: "圣像破坏派信徒"
 iconoclast_rite_adherent_plural: "圣像破坏派信徒"
 iconoclast_rite_desc: "古代东方反圣像运动的复兴，谴责圣像崇拜是逐渐蔓延的偶像崇拜，要求从教堂与家庭中移除所有圣像。"
 bogomilist_rite: "$bogomilist$"
 bogomilist_rite_name: "鲍格米勒派"
 bogomilist_rite_adj: "鲍格米勒派"
 bogomilist_rite_adherent: "鲍格米勒派信徒"
 bogomilist_rite_adherent_plural: "鲍格米勒派信徒"
 bogomilist_rite_desc: "源自斯拉夫人的二元论礼仪，其根源可追溯至神父鲍格米勒。其传教士赤脚云游，反对教阶制度，拒绝携带武器，教导信徒撒旦是可见世界的创造者。"
 paulician_rite: "$paulician$"
 paulician_rite_name: "保禄派"
 paulician_rite_adj: "保禄派"
 paulician_rite_adherent: "保禄派信徒"
 paulician_rite_adherent_plural: "保禄派信徒"
 paulician_rite_desc: "一种诞生于小亚细亚的尚武二元论礼仪，蔑视圣像与建制教阶，推崇直接阅读《保禄书信》，并愿为捍卫信仰纯洁而拿起武器。"
 messalian_rite: "$messalian$"
 messalian_rite_name: "祷告派"
 messalian_rite_adj: "祷告派"
 messalian_rite_adherent: "祷告派信徒"
 messalian_rite_adherent_plural: "祷告派信徒"
 messalian_rite_desc: "一种秘传苦修礼仪，认为不间断的祷告是唯一有意义的圣事；主张信徒一旦驱逐了寄居体内的恶魔，任何肉身行为都无法再玷污其灵魂。"
 adoptionist_rite: "$adoptionist$"
 adoptionist_rite_name: "嗣子论派"
 adoptionist_rite_adj: "嗣子论派"
 adoptionist_rite_adherent: "嗣子论派信徒"
 adoptionist_rite_adherent_plural: "嗣子论派基督徒"
 adoptionist_rite_desc: "一种伊比利亚基督论礼仪，认为基督在人性上是天主的养子而非亲生子——这一教义被加洛林教会谴责为潜藏的聂斯脱里主义。"
 ###################################
 # Fervor reset descriptions       #
 ###################################
 pam_heresy_fervor_reset_component_1_desc: "信徒奋起，抵御滋生的教义[Concept( 'rite_divergence', '偏离' )|E]"
 pam_heresy_fervor_reset_component_2_desc: "信徒奋起，抵御新生的裂教[rite|E]"
 pam_heresy_fervor_reset_component_3_desc: "信徒奋起，抵御异端的死灰复燃"
 ###################################
 # Component 1 - Light divergence  #
 ###################################
 heresy_light.0010.t: "异端分裂"
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.GetPrimaryTitle.GetBaseNameNoTier]"
 heresy_light.0010.desc.body.uneasy: "已经让[new_rite.GetName]偏离了[source_rite.GetAdjective]的正轨，"
 heresy_light.0010.desc.body.alarming: "已经使[new_rite.GetName]严重偏离了众所接受的[source_rite.GetAdjective]实践，"
 heresy_light.0010.desc.body.dangerous: "已经使[new_rite.GetName]的教义面目全非，难被[source_rite.GetAdjective]视作同源信仰，"
 heresy_light.0010.desc.differing.tenet: "其中最引人注目的差异是[differing_tenet.GetBaseName]。"
 heresy_light.0010.desc.differing.doctrine: "其中最引人注目的差异是[differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]。"
 heresy_light.0010.desc.differing.fallback: "其中教义上的差异过于细微，难以轻易言明。"
 ###################################################
 # Component 2 - New dangerously divergent rite    #
 ###################################################
 heresy_dangerous_rite.0010.t: "异端礼仪"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "[founder_clerical_title.GetNameNoTier]总主教[founder.GetCulture.GetName]人"
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.GetPrimaryTitle.GetBaseNameNoTier]"
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "[founder.GetFirstName]"
 heresy_dangerous_rite.0010.desc.opener.lands: "[founder.GetTitledFirstName]"
 heresy_dangerous_rite.0010.desc.body.alarming: "已经宣布与[source_rite.GetAdjective]彻底决裂，并宣布[new_rite.GetName]的兴起——"
 heresy_dangerous_rite.0010.desc.body.severe: "已经宣布，[new_rite.GetName]在名义之外的所有方面都已经彻底摆脱了[source_rite.GetAdjective]的束缚，正式宣告成立——"
 heresy_dangerous_rite.0010.desc.differing.tenet: "在诸多新颁教令中，最为大胆的莫过于公开宣扬[differing_tenet.GetBaseName]。"
 heresy_dangerous_rite.0010.desc.differing.doctrine: "在诸多新颁教令中，最为大胆的莫过于公开宣扬[differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]。"
 heresy_dangerous_rite.0010.desc.differing.fallback: "诸多新颁教令过于冗杂，以至于难以轻易言明。"
 heresy_dangerous_rite.0010.desc.outro: "\n\n传教士在全国各地散开了——一手拿着[origin_faith.ReligiousText]，一手举着火把。[origin_faith.GetName]的长老们不会对此说任何好话。\n\n一场潜在的异端已经白纸黑字地写下来，并且从讲坛上大声宣扬出去了；布道解决不了的事，就由刀剑和烈火来回答。"
 heresy_dangerous_rite.0010.a: "让我们开始吧。"
 heresy_dangerous_rite.0010.c: "似乎像是异端……"
 heresy_dangerous_rite.spread.title: "新礼仪传播开来"
 ###################################################
 # Component 3 - Historical heresy outbreak        #
 ###################################################
 # First-fire titles for the named historical heresies use the iconic founder.
 # Resurgences and the always-anonymous heresies fall back on a generic title.
 heresy_historical.0050.t.lollard.first: "威克里夫派异端"
 heresy_historical.0050.t.hussite.first: "胡斯派异端"
 heresy_historical.0050.t.joachimite.first: "约阿基姆派异端"
 heresy_historical.0050.t.cathar.first: "清洁派异端"
 heresy_historical.0050.t.waldensian.first: "瓦勒度派异端"
 heresy_historical.0050.t.bogomilist.first: "鲍格米勒派异端"
 heresy_historical.0050.t.resurgence: "[heresy_faith.GetAdjectiveNoTooltip]异端卷土重来"
 heresy_historical.0050.t.fallback: "[heresy_faith.GetAdjectiveNoTooltip]异端"
 heresy_historical.0050.desc.nearby.first: "如今已无法再对[founder.GetTitledFirstName]视而不见——[founder.GetSheHe]正在附近的[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]宣讲[heresy_faith.GetAdjective]的事业。我们的[origin_faith.PriestMalePlural]在讲坛上谴责[founder.GetHerHis]，但这似乎只是让这些教义对教会中的普通男女信众更具吸引力。\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "[heresy_faith.GetAdjective]的事业在[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]重新燃起，距离它曾经熊熊燃烧之地不远。[founder.GetTitledFirstName]宣讲时，廷臣和平民都还记得那异端当初带来的邪恶诱惑。\n\n"
 heresy_historical.0050.desc.distant.first: "朝圣者和商人给我们带来了[heresy_faith.GetAdjective]的消息，它已令遥远的[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]人心激荡。[founder.GetTitledFirstName]的布道正缓慢地朝我们的城门传来。\n\n"
 heresy_historical.0050.desc.distant.resurgence: "有消息传来，[heresy_faith.GetAdjective]在遥远的[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]再度燃起。看来[founder.GetTitledFirstName]既不怕永罚之火，也不怕针对[founder.GetHerHis]亵渎行径发出的谴责与敕令。\n\n"
 heresy_historical.0050.desc.insider.first: "在[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]，[founder.GetTitledFirstName]公然宣扬[heresy_faith.GetAdjective]的主张。多年来的私语低徊，终于化作一场让世人振聋发聩的讲道。\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.GetTitledFirstName]在[epicenter_ruler.GetCapitalLocation.GetTitle.GetName]重新点燃了[heresy_faith.GetAdjective]的事业。世界再次在我们的圣光下苏醒，神圣的真理也被重新宣示出来。\n\n"
 heresy_historical.0050.gloss.lollard: "[founder.GetSheHe|U]用平民都听得懂的乡音宣讲圣经：神职不应拥有田产，祭坛前不应上演戏剧。"
 heresy_historical.0050.gloss.hussite: "[founder.GetSheHe|U]宣讲平信徒应以两种方式领受圣餐，圣经须用波希米亚文书写，教会必须剥去那些用金钱买来的尊位。"
 heresy_historical.0050.gloss.joachimite: "[founder.GetSheHe|U]宣讲圣灵时代即将来临——在那时代，罗马的司铎秩序将为穷人的默观教会让路。"
 heresy_historical.0050.gloss.cathar: "[founder.GetSheHe|U]宣讲一种鲜明的二元论：称这世界为邪恶之神的作品，称罗马教会为巴比伦淫妇。"
 heresy_historical.0050.gloss.waldensian: "[founder.GetSheHe|U]宣讲一个由赤足平信徒宣道者组成的贫穷教会——不得起誓，不得作战，圣言属于所有人。"
 heresy_historical.0050.gloss.bogomilist: "[founder.GetSheHe|U]宣讲一种斯拉夫式的二元论：世界属于撒旦，唯有不息的祷告才能赎回灵魂。"
 heresy_historical.0050.gloss.paulician: "[founder.GetSheHe|U]宣讲古老的东方烈火——二元论、破坏圣像，以及对《保禄书信》的严苛解读。[founder.GetHerHis|U]的追随者宁取刀剑，也不愿被缚于火刑柱。"
 heresy_historical.0050.gloss.iconoclast: "[founder.GetSheHe|U]宣讲圣像破坏事业的复生：每一位被描绘的基督、每一位贴金的圣徒，皆是偶像；尼西亚第二届大公会议是一场永远无法弥补的谬误。"
 heresy_historical.0050.gloss.adoptionist: "[founder.GetSheHe|U]宣讲那个伊比利亚论说：基督在其人性之中，是受嗣养的。"
 heresy_historical.0050.gloss.messalian: "[founder.GetSheHe|U]宣扬以无休止的祈祷取代圣事，并称内心存在一个任何神父都无法驱逐的魔鬼。"
 heresy_historical.0050.gloss.generic: "[founder.GetSheHe|U]宣讲一种彻底的革新教义，深深扎根于[heresy_faith.GetAdjective]的传统中。"
 heresy_historical.0050.history.lollard: "\n\n它始于牛津，那里的导师和学生们一直在质疑教会法。如今他们翻译的经卷正从修道院传向城镇，其传播速度任何司铎都无法阻挡。"
 heresy_historical.0050.history.hussite: "\n\n这场运动始于布拉格的白冷礼拜堂，在那里，讲道首次以波希米亚语进行，圣爵首次被送到平信徒唇边。"
 heresy_historical.0050.history.joachimite: "\n\n它始于卡拉布里亚的一所修道院，一位院长把《默示录》当作历书解读，数算着即将到来的下一个时代。云游的托钵修士接手了这一推算，如今成了此地的街谈巷议。"
 heresy_historical.0050.history.cathar: "\n\n这些教义从巴尔干半岛向西传入，如今在朗格多克下至织工、上至子爵都有人宣认。他们的精神领袖——完人——两人一组结伴赤足而行，照料病人和垂死之人。"
 heresy_historical.0050.history.waldensian: "\n\n它始于里昂的一位商人，他将财物分给穷人，并上街宣讲。如今，受他感召的人们赤脚翻越高山，向最卑微的人分享天主之道。"
 heresy_historical.0050.history.bogomilist: "\n\n这场运动最初兴起，是因为乡间司祭教导说：饼与酒不过就是饼与酒而已。斯拉夫的乡民们坚守这一启示，至今没有哪位牧首的咒逐能劝阻他们。"
 heresy_historical.0050.history.paulician: "\n\n这场运动围绕对保禄书信的严苛解读而创立，比博斯普鲁斯海峡两岸任何一座主教座堂都更古老。在泰夫里基，在亚美尼亚高原，保禄派曾一度兴盛，直到拜占庭帝国消灭了他们的政权。"
 heresy_historical.0050.history.iconoclast: "\n\n帝国两次清空其教堂中那些描绘的基督像与贴金的圣徒；圣像两次归来。如今，偶像崇拜的问题再一次被提了出来。"
 heresy_historical.0050.history.adoptionist: "\n\n在伊比利亚边境地区，有一派主教教导，那木匠之子是被收养进入荣耀，而非生来如此。法兰克福与亚琛谴责此事，但当地人对真理的追问从未停息。"
 heresy_historical.0050.history.messalian: "\n\n它兴起于美索不达米亚的旷野——那些不眠祈祷的游方修士认为，每一个灵魂都藏着一个任何司祭都无法驱除的魔鬼。以弗所大公会议谴责了他们；他们却不以为意，继续漂流。"
 heresy_historical.0050.history.generic: "\n\n每一个时代都会燃起属于自己的这种烈火——那些打破院规的修道院，那些走出主教座堂便不再回头的宣道者。眼下这一个，正在路上。"
 heresy_historical.0050.a: "他们的事业是正义的，我将接纳它。"
 heresy_historical.0050.b: "多么坚定的信念……我将投身其中。"
 heresy_historical.0050.c: "异端……"
 heresy_historical.0050.c.insider: "我们忍耐。事业在壮大。"
 heresy_historical.spread.title: "异端蔓延"
