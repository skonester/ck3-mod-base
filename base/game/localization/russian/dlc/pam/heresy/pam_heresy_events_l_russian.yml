l_russian:
 ##############################################
 # PAM heresy system - rite type localization #
 ##############################################
 cathar_rite: "$cathar$"
 cathar_rite_name: "Катарск"
 cathar_rite_adj: "Катаризм"
 cathar_rite_adherent: "Катар"
 cathar_rite_adherent_plural: "Катары"
 cathar_rite_desc: "Движение аскетов, которые придерживаются концепции дуализма и считают, что материальный мир сотворён злым демиургом. Их наставники, именующие себя «совершенными», обязуются жить в бедности и целомудрии, при этом отвергая таинства Церкви и военную службу."
 waldensian_rite: "$waldensian$"
 waldensian_rite_name: "Вальденск"
 waldensian_rite_adj: "Вальденсизм"
 waldensian_rite_adherent: "Вальденс"
 waldensian_rite_adherent_plural: "Вальденсы"
 waldensian_rite_desc: "Последователи этого течения христианства выступают за отказ от всякого имущества и насилия, а также отстаивают право мирян самостоятельно изучать и проповедовать Священное Писание. По их мнению, приобщение к благодати доступно каждому даже без участия Церкви и священников."
 lollard_rite: "$lollard$"
 lollard_rite_name: "Лоллардск"
 lollard_rite_adj: "Лоллардизм"
 lollard_rite_adherent: "Лоллард"
 lollard_rite_adherent_plural: "Лолларды"
 lollard_rite_desc: "Реформистское христианское движение, сторонники которого отвергают церковные обряды, почитание мощей и идею о пресуществлении. Кроме того, они презирают стяжательный образ жизни духовенства, а потому отказываются от наставлений священников и сами изучают Библию в переводе на родной язык."
 hussite_rite: "$hussite$"
 hussite_rite_name: "Гуситск"
 hussite_rite_adj: "Гуситство"
 hussite_rite_adherent: "Гусит"
 hussite_rite_adherent_plural: "Гуситы"
 hussite_rite_desc: "Это богемское реформистское движение сформировалось под влиянием идей Джона Уиклифа. Недовольные разложением католической церкви, его сторонники требуют проводить богослужение на местном языке, прекратить продажу индульгенций и разрешить мирянам причащаться не только хлебом, но и вином."
 joachimite_rite: "$joachimite$"
 joachimite_rite_name: "Иоахимистск"
 joachimite_rite_adj: "Иоахимизм"
 joachimite_rite_adherent: "Иоахимит"
 joachimite_rite_adherent_plural: "Иоахимиты"
 joachimite_rite_desc: "Последователи этого апокалиптического христианского течения делят историю на три периода: Отца, Сына и грядущую эпоху Святого Духа, который низложит прежнюю церковь и установит новый духовный порядок. Они ведут бедную жизнь, проповедуют на рынках и с трепетом ждут конца света, при этом стараясь во всём уподобляться святым апостолам."
 iconoclast_rite: "$iconoclast$"
 iconoclast_rite_name: "Иконоборческ"
 iconoclast_rite_adj: "Иконоборчество"
 iconoclast_rite_adherent: "Иконоборец"
 iconoclast_rite_adherent_plural: "Иконоборцы"
 iconoclast_rite_desc: "Это движение является своеобразным продолжением древневосточного аниконизма. Его сторонники приравнивают почитание религиозных изображений к идолопоклонству и потому выступают за удаление икон из церквей и домов."
 bogomilist_rite: "$bogomilist$"
 bogomilist_rite_name: "Богомильск"
 bogomilist_rite_adj: "Богомильство"
 bogomilist_rite_adherent: "Богомил"
 bogomilist_rite_adherent_plural: "Богомилы"
 bogomilist_rite_desc: "Славянское дуалистическое христианское учение, основанное попом Богомилом. Его последователи путешествуют босиком, отвергают церковную иерархию, не носят оружие и проповедуют идею о том, что материальный мир является творением Сатаны."
 paulician_rite: "$paulician$"
 paulician_rite_name: "Павликианск"
 paulician_rite_adj: "Павликианство"
 paulician_rite_adherent: "Павликианин"
 paulician_rite_adherent_plural: "Павликиане"
 paulician_rite_desc: "Последователи этого воинствующего дуалистического течения родом из Малой Азии осуждают почитание икон и отвергают церковную иерархию. Они придают особое значение посланиям апостола Павла и не гнушаются отстаивать своё учение с оружием в руках."
 messalian_rite: "$messalian$"
 messalian_rite_name: "Мессалианск"
 messalian_rite_adj: "Мессалианство"
 messalian_rite_adherent: "Мессалианин"
 messalian_rite_adherent_plural: "Мессалиане"
 messalian_rite_desc: "Мистическое аскетическое учение, согласно которому единственным важным таинством является непрестанная молитва. Его последователи верят, что если верующий однажды уже изгнал из себя злого духа, то впредь ничто не сможет его осквернить."
 adoptionist_rite: "$adoptionist$"
 adoptionist_rite_name: "Адопционистск"
 adoptionist_rite_adj: "Адопционизм"
 adoptionist_rite_adherent: "Адопционист"
 adoptionist_rite_adherent_plural: "Адопционисты"
 adoptionist_rite_desc: "Возникшее в Иберии христологическое учение, согласно которому Христос в своём земном обличье не родился сыном Божьим, но был усыновлён Богом в момент крещения. Каролингская церковь осуждает эту доктрину как продолжение несторианской ереси."
 ###################################
 # Fervor reset descriptions       #
 ###################################
 pam_heresy_fervor_reset_component_1_desc: "Верующие выступают против роста [Concept('rite_divergence', 'инообрядчества')|E]"
 pam_heresy_fervor_reset_component_2_desc: "Верующие выступают против нового раскольнического [Concept('rite', 'течения')|E]"
 pam_heresy_fervor_reset_component_3_desc: "Верующие выступают против возрождения ересей"
 ###################################
 # Component 1 - Light divergence  #
 ###################################
 heresy_light.0010.t: "Еретические расхождения"
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName]"
 heresy_light.0010.desc.body.uneasy: "всё дальше уводит #L [new_rite.GetName|l]ое#! течение от его #L [source_rite.GetName|l]их#! истоков."
 heresy_light.0010.desc.body.alarming: "[Select_CString(founder.IsFemale, 'добилась', 'добился')] того, что теперь #L [new_rite.GetName|l]ое#! течение довольно сильно отходит от установленных #L [source_rite.GetName|l]их#! практик."
 heresy_light.0010.desc.body.dangerous: "[Select_CString(founder.IsFemale, 'исказила', 'исказил')] #L [new_rite.GetName|l]ое#! течение настолько, что его уже с трудом можно назвать #L [source_rite.GetName|l]им#!."
 heresy_light.0010.desc.differing.tenet: "При этом наиболее явное расхождение — догмат «[differing_tenet.GetBaseName]»."
 heresy_light.0010.desc.differing.doctrine: "При этом наиболее явное расхождение — доктрина «[differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]»."
 heresy_light.0010.desc.differing.fallback: "Между верованиями возникло так много расхождений, что им сложно подобрать какое-то конкретное название."
 ###################################################
 # Component 2 - New dangerously divergent rite    #
 ###################################################
 heresy_dangerous_rite.0010.t: "Еретическое течение"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "#L [founder.GetCulture.GetCollectiveNoun]ий#! архиепископ [founder.GetFirstName]"
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName]"
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "из владения [founder_clerical_title.GetNameNoTier]"
 heresy_dangerous_rite.0010.desc.opener.lands: "из владения [founder.GetPrimaryTitle.GetBaseNameNoTier]"
 heresy_dangerous_rite.0010.desc.body.alarming: "[Select_CString(founder.IsFemale, 'пошла', 'пошёл')] вразрез с #L [source_rite.GetName|l]ими#! канонами и [Select_CString(founder.IsFemale, 'основала', 'основал')] #L [new_rite.GetName|l]ое#! течение."
 heresy_dangerous_rite.0010.desc.body.severe: "фактически [Select_CString(founder.IsFemale, 'оборвала', 'оборвал')] все связи со своими #L [source_rite.GetName|l]ими#! корнями и [Select_CString(founder.IsFemale, 'основала', 'основал')] #L [new_rite.GetName|l]ое#! течение."
 heresy_dangerous_rite.0010.desc.differing.tenet: "Среди прочих расхождений особенно выделяется догмат «[differing_tenet.GetBaseName]», который его последователи исповедуют совершенно открыто."
 heresy_dangerous_rite.0010.desc.differing.doctrine: "Среди прочих расхождений особенно выделяется доктрина «[differing_tenet.GetBaseName]», которой его последователи придерживаются совершенно открыто."
 heresy_dangerous_rite.0010.desc.differing.fallback: "Между этими учениями так много богословских расхождений, что их даже нет смысла перечислять."
 heresy_dangerous_rite.0010.desc.outro: "\n\nСвященники по всей державе протестуют против подобного инакомыслия. У кого-то в руках [origin_faith.ReligiousText], у иных — факелы, но все так или иначе выражают своё негодование, и в особенности старейшины #L [origin_faith.GetName|l]ой#! веры.\n\nОни не могут допустить, чтобы кто-либо вещал ересь с кафедр и закреплял её на бумаге. И если им не удастся решить этот конфликт проповедью, то говорить будут мечи."
 heresy_dangerous_rite.0010.a: "Да будет так."
 heresy_dangerous_rite.0010.c: "Как по мне, это самая настоящая ересь…"
 heresy_dangerous_rite.spread.title: "Распространение нового течения"
 ###################################################
 # Component 3 - Historical heresy outbreak        #
 ###################################################
 # First-fire titles for the named historical heresies use the iconic founder.
 # Resurgences and the always-anonymous heresies fall back on a generic title.
 heresy_historical.0050.t.lollard.first: "Ересь Уиклифа"
 heresy_historical.0050.t.hussite.first: "Ересь Гуса"
 heresy_historical.0050.t.joachimite.first: "Ересь Иоахима"
 heresy_historical.0050.t.cathar.first: "Катарская ересь"
 heresy_historical.0050.t.waldensian.first: "Ересь Вальдо"
 heresy_historical.0050.t.bogomilist.first: "Ересь Богомила"
 heresy_historical.0050.t.resurgence: "Возвращение [heresy_faith.GetNameNoTooltip|l]ой ереси"
 heresy_historical.0050.t.fallback: "[heresy_faith.GetNameNoTooltip]ая ересь"
 heresy_historical.0050.desc.nearby.first: "[founder.GetTitledFirstName|U] продолжает проповедовать #L [heresy_faith.GetName|l]ое#! учение в #L [epicenter_ruler.GetCapitalLocation.GetTitle.GetAdjective|l]их#! землях, и мы больше не можем закрывать на это глаза. Наши [origin_faith.PriestMalePlural] предали [founder.GetHerHis] богопротивную ересь анафеме, но это лишь поспособствовало росту её популярности среди простого люда.\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "#L [heresy_faith.GetName]ое#! учение вновь распространяется в #L [epicenter_ruler.GetCapitalLocation.GetTitle.GetAdjective|l]ой#! земле — там, где эта ересь в своё время разгорелась подобно пожару. [founder.GetTitledFirstName|U] истово проповедует свои богопротивные взгляды, ввергая в соблазн и придворных, и простой народ.\n\n"
 heresy_historical.0050.desc.distant.first: "Паломники и торговцы доносят вести об #L [heresy_faith.GetName|l]ой#! ереси, поразившей далёкие #L [epicenter_ruler.GetCapitalLocation.GetTitle.GetAdjective|l]ие#! земли. [founder.GetTitledFirstName|U] всё шире проповедует своё богопротивное учение, и к [Select_CString(founder.IsFemale, 'ней', 'нему' )] уже начинают прислушиваться даже в нашей стране.\n\n"
 heresy_historical.0050.desc.distant.resurgence: "По слухам, в далёкой #L [epicenter_ruler.GetCapitalLocation.GetTitle.GetAdjective|l]ой#! земле вновь поднимает голову #L [heresy_faith.GetName]ая#! ересь. [founder.GetTitledFirstName|U] в своём безумии не боится ни земных кар и запретов, ни пламени преисподней.\n\n"
 heresy_historical.0050.desc.insider.first: "[founder.GetTitledFirstName|U] открыто проповедует #L [heresy_faith.GetName|l]ое#! учение в #L [epicenter_ruler.GetCapitalLocation.GetTitle.GetAdjective|l]их#! владениях. Спустя многие годы забвения мир наконец услышит нашу проповедь.\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.GetTitledFirstName|U] вновь разжигает искру #L [heresy_faith.GetName|l]ого#! учения на #L [epicenter_ruler.GetCapitalLocation.GetTitle.GetAdjective|l]ой#! земле. Божественный свет снова воссияет над миром, и глаза верующих откроются святой истине.\n\n"
 heresy_historical.0050.gloss.lollard: "[Select_CString(founder.IsFemale, 'Она', 'Он')] выступает за изучение Писания на родном языке, отчуждение земель духовенства и отказ от вычурных церковных обрядов."
 heresy_historical.0050.gloss.hussite: "[Select_CString(founder.IsFemale, 'Она', 'Он')] выступает за причащение мирян под двумя видами, изучение Писания на местном языке и запрет на покупку церковных должностей."
 heresy_historical.0050.gloss.joachimite: "[Select_CString(founder.IsFemale, 'Она', 'Он')] возвещает о наступлении эпохи Святого Духа, во время которой на смену текущей римской церковной иерархии придут смиренные и нищие духом верующие люди."
 heresy_historical.0050.gloss.cathar: "[Select_CString(founder.IsFemale, 'Она', 'Он')] выступает за концепцию дуализма и считает, что материальный мир сотворён злым демиургом, а Римско-католическая церковь — та самая Вавилонская блудница из книги Откровения."
 heresy_historical.0050.gloss.waldensian: "[Select_CString(founder.IsFemale, 'Она', 'Он')] призывает к отказу от частной собственности, обетов и войн и поддерживает мирскую проповедь и свободу чтения Писания."
 heresy_historical.0050.gloss.bogomilist: "[Select_CString(founder.IsFemale, 'Она', 'Он')] продвигает идею славянского дуализма, согласно которой миром правит Сатана, и лишь полное отречение от материального может обеспечить человеку спасение."
 heresy_historical.0050.gloss.paulician: "[Select_CString(founder.IsFemale, 'Она', 'Он')] поддерживает концепцию дуализма и подчёркивает важность посланий апостола Павла, при этом осуждая почитание икон. [Select_CString(founder.IsFemale, 'Её', 'Его')] ревностные последователи скорее умрут в бою, чем откажутся от своей веры."
 heresy_historical.0050.gloss.iconoclast: "[Select_CString(founder.IsFemale, 'Она', 'Он')] выступает за возрождение иконоборческого движения. По [Select_CString(founder.IsFemale, 'её', 'его')] мнению, любое изображение Христа и святых суть идолы, а Второй Никейский собор — одна из главных трагедий христианства."
 heresy_historical.0050.gloss.adoptionist: "[Select_CString(founder.IsFemale, 'Она', 'Он')] повторяет тезисы иберийской доктрины, утверждавшей, что Христос в своём земном обличье был усыновлён Богом."
 heresy_historical.0050.gloss.messalian: "[Select_CString(founder.IsFemale, 'Она', 'Он')] проповедует, что единственным истинным таинством является постоянная молитва и никакой священник не в силах изгнать злого духа, живущего внутри человека."
 heresy_historical.0050.gloss.generic: "[Select_CString(founder.IsFemale, 'Она', 'Он')] выступает за радикальное обновление веры в соответствии с #L [heresy_faith.GetName|l]ими#! догматами."
 heresy_historical.0050.history.lollard: "\n\nТечение зародилось в Оксфорде, где магистры и студенты начали подвергать сомнению догматы канонического права. Составленные ими в монастырях переводы Писания быстро расходятся среди горожан, и ни один священник не в силах остановить их распространение."
 heresy_historical.0050.history.hussite: "\n\nЭто движение зародилось в Вифлеемской капелле в Праге, где впервые состоялось богослужение на чешском языке, а мирянам позволили причаститься из святой чаши."
 heresy_historical.0050.history.joachimite: "\n\nЭто течение возникло в калабрийском монастыре, настоятель которого рассматривал книгу Откровения как своеобразный календарь и пытался отсчитать дни до наступления на земле Царства Божьего. Его идеи подхватили нищенствующие монахи, и теперь о них говорят на всех рынках страны."
 heresy_historical.0050.history.cathar: "\n\nЭто учение проникло на запад с Балкан и нашло множество сторонников в Лангедоке, где среди его приверженцев встречаются и виконты, и простые ткачи. Их духовные вожди — «совершенные» — всегда ходят по двое, не надевают обуви и заботятся о больных и умирающих."
 heresy_historical.0050.history.waldensian: "\n\nДвижение началось с одного лионского купца, который раздал всё своё богатство бедным и стал проповедовать на улицах. Теперь его последователи босиком переходят через горы, чтобы донести слово Божье самым презренным среди людей."
 heresy_historical.0050.history.bogomilist: "\n\nЭто движение зародилось в среде деревенских священников, которые начали проповедовать, что хлеб и вино причастия — это просто хлеб и вино. Это откровение пришлось по нраву славянским крестьянам, и никакие провозглашённые патриархом анафемы не в силах их переубедить."
 heresy_historical.0050.history.paulician: "\n\nЭто течение старше любого собора в районе Босфора; в его основе лежит буквальное толкование посланий апостола Павла. Некогда у павликиан была своя держава на Армянском нагорье, с центром в крепости Тефрика, однако их государство уничтожили византийцы."
 heresy_historical.0050.history.iconoclast: "\n\nИмперия дважды очищала церкви от изображений Христа и позолоченных статуй святых, и оба раза они возвращались на место. Но противники идолопоклонства не оставляют борьбы…"
 heresy_historical.0050.history.adoptionist: "\n\nНекоторые епископы в Иберийском приграничье учат, что описанный в Евангелии сын плотника при рождении не имел божественного начала. Эта доктрина была дважды осуждена на Франкфуртском и Ахенском соборах, но местное население всё ещё полно сомнений…"
 heresy_historical.0050.history.messalian: "\n\nОсновоположниками этого учения были месопотамские монахи, которые верили в присутствие демонов в душе каждого человека и потому всё свободное время проводили в молитве. Эфесский собор осудил эти взгляды как ересь, однако их приверженцы всё равно от них не отказались."
 heresy_historical.0050.history.generic: "\n\nВ каждую эпоху возникают спорные религиозные движения, которые, как правило, основывают вольнодумные монахи и священники. Это течение не первое и уж точно не последнее из них."
 heresy_historical.0050.a: "Их дело правое, поэтому я их поддержу."
 heresy_historical.0050.b: "Можно лишь позавидовать их твёрдым убеждениям."
 heresy_historical.0050.c: "Проклятые еретики…"
 heresy_historical.0050.c.insider: "Мы не отступимся от своих взглядов."
 heresy_historical.spread.title: "Распространение ереси"
