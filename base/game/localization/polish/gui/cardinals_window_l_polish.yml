 theocratic_elective_pious: "Ucieleśnienie pobożności"
 theocratic_elective_pious_desc: "#flavor Kolegium musi wysunąć kandydaturę uznawaną przez wszystkich za godną: kardynała, którego życie już teraz przypomina żywot świętego.#!\n\nAby stać się #EMP ucieleśnieniem pobożności#!, kandydat musi być bardziej świątobliwy niż jakikolwiek inny [cardinal|El]. [piety_level|E] ma zdecydowanie największe znaczenie, a zaraz potem – [learning|El] i posiadanie cechy [GetTrait('lifestyle_scholar').GetName( GetPlayer )|l], [GetTrait('pilgrim').GetName( GetPlayer )|l] lub [GetTrait('lifestyle_mystic').GetName( GetPlayer )|l]. Jeden popełniony [sin|El] to skaza, której nie wynagrodzi jedna [virtue|El].[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "Ucieleśnienie popularności"
 theocratic_elective_populist_desc: "#flavor Papież, za którym wierni nie chcą podążać, to żaden papież, dlatego kolegium wysuwa kandydaturę osoby już wcześniej witanej z entuzjazmem na ulicach.#!\n\nAby stać się #EMP ucieleśnieniem popularności#!, kandydat musi być sławniejszy niż jakikolwiek inny [cardinal|El]. Zwiększ swój [prestige_level|E] i umiejętność [Concept('diplomacy', 'dyplomacji')|E], miej [Concept('friends', 'przyjaciół')|E] w [Concept('college_of_cardinals', 'kolegium kardynalskim')|E], wyznawaj [personal_tenets|El] o wysokiej [Concept('tenet_popularity', 'popularności')|E] i użyj [Concept('decision', 'decyzji')|E] „[GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName]”.[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "Ucieleśnienie potęgi"
 theocratic_elective_powerful_desc: "#flavor Stolica Piotrowa ma zarówno wrogów, jak i zwolenników, dlatego kolegium wysuwa kandydaturę prałata dysponującego środkami, by ją utrzymać.#!\n\nAby stać się #EMP ucieleśnieniem potęgi#!, kandydat musi mieć większe wpływy niż jakikolwiek inny [cardinal|El]. Zadbaj, by twój [rite|El] praktykowano w większej liczbie [Concept('counties', 'hrabstw')|E], władaj [Concept('holy_sites', 'miejscami świętymi')|E], podnieś swój [dynasty_prestige_level|El] – lub użyj [Concept('character_interaction', 'interakcji z postacią')|E] „#V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')]#!#!”, aby wybić się przed szereg.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
